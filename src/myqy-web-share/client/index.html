<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#252729" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebeceb" media="(prefers-color-scheme: light)" />
    <title>Serpent</title>
    <script>
      // The client picks its language from navigator.language, so <html lang>
      // must follow it too — a hardcoded zh-CN misleads screen readers and
      // hyphenation when an English speaker opens the share.
      document.documentElement.lang = navigator.language.toLowerCase().startsWith('zh')
        ? 'zh-CN'
        : 'en';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
